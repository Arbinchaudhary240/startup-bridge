services:
  - type: web
    name: startupbridge-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: startupbridge-api.onrender.com
      - key: DJANGO_USE_X_FORWARDED_PROTO
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_CORS_ALLOWED_ORIGINS
        sync: false
